[workspace]
resolver = "2"
members = [
    "crates/uj-core",
    "crates/uj-sandbox",
    "crates/uj-engine",
    "crates/uj-checker",
    "crates/uj-report",
    "crates/uj-tui",
    "crates/uj-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["uj developers"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Codecsystem/uj-cil"

[workspace.dependencies]
# Internal crates
uj-core = { path = "crates/uj-core" }
uj-sandbox = { path = "crates/uj-sandbox" }
uj-engine = { path = "crates/uj-engine" }
uj-checker = { path = "crates/uj-checker" }
uj-report = { path = "crates/uj-report" }
uj-tui = { path = "crates/uj-tui" }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
schemars = { version = "0.8", features = ["derive"] }

# CLI & Error handling
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
anyhow = "1.0"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency & Sync
crossbeam-channel = "0.5"
parking_lot = "0.12"
ctrlc = "3.4"

# Hashing & I/O
blake3 = "1.5"
memchr = "2.7"
memmap2 = "0.9"
globset = "0.4"
regex = "1.10"
tempfile = "3.14"
which = "7.0"

# UI & Template
minijinja = "2.7"
ratatui = "0.29"
crossterm = "0.28"
indicatif = "0.17"

# System & Topology
num_cpus = "1.16"
sysinfo = "0.33"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
